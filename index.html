<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bruno's Portfolio - Profile</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="navbar">
    <nav role="navigation" aria-label="Main navigation">
      <a href="index.html" class="nav-link active">Profile</a>
      <a href="contact.html" class="nav-link">Contact Us</a>
      <a href="about-me.html" class="nav-link">About Me</a>
    </nav>
  </div>

  <main>
    <div class="profile-container">
      <article class="profile-card" data-testid="test-profile-card">
        <figure>
          <img
            src="./image/profile picture.png"
            alt="Bruno's profile photo"
            data-testid="test-user-avatar"
          />
        </figure>
        <h2 data-testid="test-user-name">Alain Bruno</h2>
        <p data-testid="test-user-bio">
          A frontend engineer passionate about crafting clean UI and
          accessible web experiences.
        </p>
        <nav class="profile-links" data-testid="test-user-social-links" aria-label="Social links">
          <a
            href="https://x.com"
            target="_blank"
            rel="noopener noreferrer"
            data-testid="test-user-social-twitter"
          >Twitter</a>
          <a
            href="https://github.com"
            target="_blank"
            rel="noopener noreferrer"
            data-testid="test-user-social-github"
          >GitHub</a>
          <a
            href="https://linkedin.com"
            target="_blank"
            rel="noopener noreferrer"
            data-testid="test-user-social-linkedin"
          >LinkedIn</a>
        </nav>
      </article>

      <div class="profile-sections">
        <section class="profile-section">
          <h3>Hobbies</h3>
          <ul data-testid="test-user-hobbies">
            <li>Coding</li>
            <li>The gym</li>
          </ul>
        </section>

        <section class="profile-section">
          <h3>Dislikes</h3>
          <ul data-testid="test-user-dislikes">
            <li>Bad food</li>
            <li>Ugly UI</li>
          </ul>
        </section>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
