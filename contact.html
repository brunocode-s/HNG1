<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us - Bruno's Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="navbar">
    <nav role="navigation" aria-label="Main navigation">
      <a href="index.html" class="nav-link">Profile</a>
      <a href="contact.html" class="nav-link active">Contact Us</a>
      <a href="about-me.html" class="nav-link">About Me</a>
    </nav>
  </div>

  <main>
    <h1>Contact Us</h1>
    <form class="contact-form" id="contactForm" novalidate>
      <div data-testid="test-contact-success" class="success-message">
        Thank you! Your message has been sent successfully.
      </div>

      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input
          type="text"
          id="fullName"
          data-testid="test-contact-name"
          required
          aria-describedby="nameError"
        />
        <div
          id="nameError"
          class="error-message"
          data-testid="test-contact-error-name"
        ></div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          data-testid="test-contact-email"
          required
          aria-describedby="emailError"
        />
        <div
          id="emailError"
          class="error-message"
          data-testid="test-contact-error-email"
        ></div>
      </div>

      <div class="form-group">
        <label for="subject">Subject</label>
        <input
          type="text"
          id="subject"
          data-testid="test-contact-subject"
          required
          aria-describedby="subjectError"
        />
        <div
          id="subjectError"
          class="error-message"
          data-testid="test-contact-error-subject"
        ></div>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea
          id="message"
          data-testid="test-contact-message"
          required
          rows="5"
          aria-describedby="messageError"
        ></textarea>
        <div
          id="messageError"
          class="error-message"
          data-testid="test-contact-error-message"
        ></div>
      </div>

      <button
        type="submit"
        data-testid="test-contact-submit"
      >Send Message</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
